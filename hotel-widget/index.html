<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hotel Results</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: transparent;
      color: #1a1a1a;
      font-size: 14px;
      padding: 16px;
    }

    /* ── Header ─────────────────────────────────────────────────── */
    .page-header {
      background: #003580;
      color: #fff;
      border-radius: 10px;
      padding: 14px 18px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .page-header h2 {
      font-size: 1.1rem;
      font-weight: 700;
    }
    .page-header .count {
      font-size: 0.82rem;
      opacity: 0.85;
      background: rgba(255,255,255,0.18);
      border-radius: 20px;
      padding: 3px 10px;
    }

    /* ── Card ────────────────────────────────────────────────────── */
    .card {
      background: #fff;
      border: 1px solid #e7e7e7;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 12px;
      display: flex;
      transition: box-shadow 0.15s;
    }
    .card:hover { box-shadow: 0 4px 18px rgba(0,53,128,0.13); }

    /* ── Image ───────────────────────────────────────────────────── */
    .card-img {
      width: 200px;
      min-width: 200px;
      height: 160px;
      background: linear-gradient(135deg, #003580 0%, #009fe3 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3.2rem;
      position: relative;
      overflow: hidden;
    }
    .card-img img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* ── Content ─────────────────────────────────────────────────── */
    .card-content {
      flex: 1;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .hotel-name {
      font-size: 1rem;
      font-weight: 700;
      color: #003580;
      line-height: 1.3;
    }

    /* Score badge: blue rounded square */
    .score-badge {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-shrink: 0;
    }
    .score-box {
      background: #003580;
      color: #fff;
      font-size: 0.95rem;
      font-weight: 700;
      border-radius: 6px 6px 6px 0;
      padding: 4px 8px;
      min-width: 38px;
      text-align: center;
    }
    .score-label {
      font-size: 0.7rem;
      color: #595959;
      margin-top: 2px;
      white-space: nowrap;
    }

    .star-row {
      display: flex;
      align-items: center;
      gap: 3px;
    }
    .star { font-size: 0.8rem; color: #feba02; }

    .location {
      font-size: 0.78rem;
      color: #595959;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 2px;
    }
    .badge-cancel {
      font-size: 0.74rem;
      color: #008009;
      font-weight: 600;
    }
    .badge-genius {
      font-size: 0.72rem;
      background: #003580;
      color: #feba02;
      border-radius: 3px;
      padding: 1px 6px;
      font-weight: 700;
    }

    .card-bottom {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      margin-top: auto;
      padding-top: 8px;
      border-top: 1px solid #f0f0f0;
    }

    .price-block {}
    .price-note { font-size: 0.72rem; color: #595959; }
    .price-amount {
      font-size: 1.4rem;
      font-weight: 800;
      color: #1a1a1a;
      line-height: 1.1;
    }
    .price-per { font-size: 0.72rem; color: #595959; }
    .price-tax  { font-size: 0.7rem; color: #008009; }

    .btn-availability {
      background: #0071c2;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 9px 16px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
    }
    .btn-availability:hover { background: #005999; }

    /* ── Loading / Empty ─────────────────────────────────────────── */
    .state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 260px;
      text-align: center;
      gap: 14px;
    }
    .state-icon  { font-size: 3rem; }
    .state-title { font-size: 1rem; font-weight: 600; color: #003580; }
    .state-sub   { font-size: 0.85rem; color: #595959; }

    .spinner {
      width: 36px; height: 36px;
      border: 3px solid #d4e2f7;
      border-top-color: #003580;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Responsive ──────────────────────────────────────────────── */
    @media (max-width: 500px) {
      .card { flex-direction: column; }
      .card-img { width: 100%; min-width: unset; height: 140px; }
      .card-top { flex-direction: column; }
    }
  </style>
</head>
<body>
<div id="root"></div>

<script>
(function () {
  'use strict';

  var root = document.getElementById('root');

  // ── Helpers ───────────────────────────────────────────────────────────────

  function esc(s) {
    return String(s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function scoreLabel(r) {
    if (!r) return '';
    var n = parseFloat(r) * 2; // our rating is /5, booking is /10
    if (n >= 9)   return 'Exceptional';
    if (n >= 8)   return 'Very Good';
    if (n >= 7)   return 'Good';
    if (n >= 6)   return 'Pleasant';
    return 'Review score';
  }

  function scoreDisplay(r) {
    if (!r) return '';
    return (parseFloat(r) * 2).toFixed(1);
  }

  function stars(r) {
    var n = Math.round(r || 0);
    var s = '';
    for (var i = 0; i < 5; i++) {
      s += '<span class="star" style="color:' + (i < n ? '#feba02' : '#d4d4d4') + '">&#9733;</span>';
    }
    return s;
  }

  // ── Render ────────────────────────────────────────────────────────────────

  function renderSpinner() {
    root.innerHTML = '<div class="state"><div class="spinner"></div>'
      + '<p class="state-sub">Searching for the best hotels\u2026</p></div>';
  }

  function renderEmpty() {
    root.innerHTML = '<div class="state">'
      + '<div class="state-icon">&#x1F50D;</div>'
      + '<p class="state-title">No hotels found</p>'
      + '<p class="state-sub">Try searching a different location.</p></div>';
  }

  function renderHotels(hotels) {
    if (!hotels || hotels.length === 0) { renderEmpty(); return; }

    var location = hotels[0].location || '';

    var cards = hotels.map(function (h) {
      var thumb = (h.image_url && h.image_url.indexOf('example.com') === -1)
        ? '<img src="' + esc(h.image_url) + '" alt="' + esc(h.name) + '" onerror="this.remove()">'
        : '&#x1F3E8;';

      var score = h.rating ? (
        '<div class="score-badge">'
        + '<div class="score-box">' + esc(scoreDisplay(h.rating)) + '</div>'
        + '<div class="score-label">' + esc(scoreLabel(h.rating)) + '</div>'
        + '</div>'
      ) : '';

      return '<div class="card">'
        + '<div class="card-img">' + thumb + '</div>'
        + '<div class="card-content">'

        + '<div class="card-top">'
        + '<div>'
        + '<div class="hotel-name">' + esc(h.name) + '</div>'
        + '<div class="star-row" style="margin:4px 0">' + stars(h.rating) + '</div>'
        + '<div class="location">'
        + '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#595959" stroke-width="2.5">'
        + '<path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>'
        + '</svg>'
        + esc(h.location)
        + '</div>'
        + '</div>'
        + score
        + '</div>'

        + '<div class="badges">'
        + '<span class="badge-cancel">&#10003; Free cancellation</span>'
        + (h.rating && parseFloat(h.rating) >= 4 ? '<span class="badge-genius">Genius</span>' : '')
        + '</div>'

        + '<div class="card-bottom">'
        + '<div class="price-block">'
        + '<div class="price-note">Starting from</div>'
        + '<div>'
        + '<span class="price-amount">$' + esc(String(h.price)) + '</span>'
        + '<span class="price-per"> /night</span>'
        + '</div>'
        + '<div class="price-tax">Includes taxes &amp; fees</div>'
        + '</div>'
        + '<button class="btn-availability">See availability &rsaquo;</button>'
        + '</div>'

        + '</div></div>';
    }).join('');

    root.innerHTML = '<div class="page-header">'
      + '<h2>&#x1F3E8; Hotels in ' + esc(location) + '</h2>'
      + '<span class="count">' + hotels.length + ' propert' + (hotels.length !== 1 ? 'ies' : 'y') + '</span>'
      + '</div>'
      + cards;
  }

  // ── Data sources ──────────────────────────────────────────────────────────

  function tryLoad(data) {
    if (!data) return false;
    var hotels = data.hotels || (Array.isArray(data) ? data : null);
    if (hotels) { renderHotels(hotels); return true; }
    return false;
  }

  // 1. window.openai.toolOutput — ChatGPT Apps SDK (primary)
  function checkOpenAiGlobals() {
    return tryLoad(window.openai && window.openai.toolOutput);
  }

  // 2. postMessage — ui/notifications/tool-result
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d) return;
    if (d.method === 'ui/notifications/tool-result') {
      if (tryLoad(d.params && d.params.structuredContent)) return;
    }
    tryLoad(d.structuredContent || d.data || (d.hotels ? d : null));
  });

  // 3. ?data=<base64> — Vercel preview link
  (function () {
    try {
      var raw = new URLSearchParams(location.search).get('data');
      if (raw) tryLoad(JSON.parse(atob(raw)));
    } catch (_) {}
  })();

  // Boot
  if (!checkOpenAiGlobals()) {
    // Listen for the event in case data arrives after this script runs
    window.addEventListener('openai:set-globals', function () { checkOpenAiGlobals(); });

    // Fallback poll: covers the race where the event fired before our listener was added
    var attempts = 0;
    var poll = setInterval(function () {
      if (checkOpenAiGlobals() || ++attempts >= 50) {
        clearInterval(poll);
      }
    }, 200); // check every 200 ms, up to 10 s

    renderSpinner();
  }
})();
</script>
</body>
</html>
