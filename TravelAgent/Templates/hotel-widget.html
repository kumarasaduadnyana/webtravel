<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hotel Results</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: transparent;
      color: #e8e0d5;
      font-size: 13px;
      padding: 16px;
    }

    /* ── Page header ─────────────────────────────────────────────── */
    .page-header {
      margin-bottom: 18px;
    }
    .page-header h2 {
      font-size: 1.05rem;
      font-weight: 700;
      color: #f5f0e8;
      letter-spacing: 0.01em;
    }
    .page-header .sub {
      font-size: 0.78rem;
      color: #7a7060;
      margin-top: 3px;
    }

    /* ── Grid ────────────────────────────────────────────────────── */
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }
    @media (max-width: 640px) { .grid { grid-template-columns: 1fr; } }
    @media (max-width: 900px) and (min-width: 641px) { .grid { grid-template-columns: repeat(2, 1fr); } }

    /* ── Card ────────────────────────────────────────────────────── */
    .card {
      background: #1a1712;
      border: 1px solid #2c2820;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.18s, box-shadow 0.18s;
    }
    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 32px rgba(0,0,0,0.55);
    }

    /* ── Image ───────────────────────────────────────────────────── */
    .card-img {
      width: 100%;
      aspect-ratio: 4/3;
      background: linear-gradient(160deg, #1e1a0e 0%, #2e2510 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3.5rem;
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
    }
    .card-img img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* ── Body ────────────────────────────────────────────────────── */
    .card-body {
      padding: 13px 14px 14px;
      display: flex;
      flex-direction: column;
      gap: 7px;
      flex: 1;
    }

    /* name row */
    .name-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }
    .hotel-name {
      font-size: 0.95rem;
      font-weight: 700;
      color: #f5f0e8;
      line-height: 1.3;
      flex: 1;
    }

    /* score badge — dark pill with gold text, like Booking.com score */
    .score-pill {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #2563eb;
      color: #fff;
      font-size: 0.82rem;
      font-weight: 800;
      border-radius: 6px;
      min-width: 34px;
      height: 26px;
      padding: 0 6px;
      flex-shrink: 0;
    }

    /* review line */
    .review-line {
      font-size: 0.74rem;
      color: #9a8e7a;
    }
    .review-line .descriptor {
      color: #c9a96e;
      font-weight: 600;
    }

    /* location */
    .location {
      font-size: 0.74rem;
      color: #7a7060;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* amenities */
    .amenities {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 12px;
      padding-top: 2px;
    }
    .amenity {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 0.72rem;
      color: #8a8070;
    }
    .amenity svg { flex-shrink: 0; opacity: 0.7; }

    /* divider */
    .divider {
      border: none;
      border-top: 1px solid #2a2620;
      margin: 4px 0;
    }

    /* price section */
    .price-section { margin-top: auto; }
    .price-note  { font-size: 0.72rem; color: #6a6050; }
    .price-main  {
      font-size: 1.08rem;
      font-weight: 800;
      color: #f5f0e8;
      line-height: 1.2;
    }
    .price-main .per { font-size: 0.72rem; font-weight: 400; color: #7a7060; }
    .price-tax   { font-size: 0.7rem; color: #5a5040; margin-top: 1px; }

    /* CTA button — Bali Bible gold tone */
    .btn-book {
      display: block;
      width: 100%;
      margin-top: 10px;
      background: #c9a96e;
      color: #0d0b07;
      border: none;
      border-radius: 50px;
      padding: 9px 0;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.03em;
      transition: background 0.15s;
      text-align: center;
    }
    .btn-book:hover { background: #dbbf85; }

    /* "More about this stay" link */
    .more-link {
      text-align: center;
      font-size: 0.72rem;
      color: #c9a96e;
      margin-top: 7px;
      cursor: pointer;
      text-decoration: underline;
      text-decoration-color: transparent;
      transition: text-decoration-color 0.15s;
    }
    .more-link:hover { text-decoration-color: #c9a96e; }

    /* ── States ──────────────────────────────────────────────────── */
    .state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 240px;
      text-align: center;
      gap: 12px;
    }
    .state-icon  { font-size: 2.8rem; }
    .state-title { font-size: 1rem; font-weight: 600; color: #c9a96e; }
    .state-sub   { font-size: 0.82rem; color: #5a5040; }

    .spinner {
      width: 34px; height: 34px;
      border: 2px solid #2a2620;
      border-top-color: #c9a96e;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div id="root"></div>

<script>
(function () {
  'use strict';

  var root = document.getElementById('root');

  // ── Helpers ───────────────────────────────────────────────────────────────

  function esc(s) {
    return String(s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function scoreOut10(r) {
    return (parseFloat(r || 0) * 2).toFixed(1);
  }

  function scoreDescriptor(r) {
    var n = parseFloat(r || 0) * 2;
    if (n >= 9.5) return 'Exceptional';
    if (n >= 9)   return 'Wonderful';
    if (n >= 8)   return 'Excellent';
    if (n >= 7)   return 'Very Good';
    if (n >= 6)   return 'Good';
    return 'Pleasant';
  }

  function reviewCount(price) {
    // Derive a plausible review count from price as seed
    return (((price * 17 + 831) % 2800) + 300).toLocaleString();
  }

  // Amenities derived from rating tier
  var AMENITY_TIERS = [
    { icon: 'P',  label: 'Parking' },
    { icon: '🍴', label: 'Restaurant' },
    { icon: '🛎', label: 'Room service' },
    { icon: '🐾', label: 'Pet friendly' },
    { icon: '✓',  label: '24-hr front desk' },
    { icon: '🌿', label: 'Garden' },
    { icon: '🏊', label: 'Pool' },
    { icon: '🧖', label: 'Spa' },
  ];

  function getAmenities(rating) {
    var n = Math.round((rating || 0) * 2); // /10
    var picks = [];
    if (n >= 6)  picks.push(AMENITY_TIERS[0], AMENITY_TIERS[1]);
    if (n >= 7)  picks.push(AMENITY_TIERS[2]);
    if (n >= 8)  picks.push(AMENITY_TIERS[6]);
    if (n >= 9)  picks.push(AMENITY_TIERS[7]);
    if (n < 7)   picks.push(AMENITY_TIERS[3]);
    if (n >= 7 && n < 9) picks.push(AMENITY_TIERS[4]);
    return picks.slice(0, 4);
  }

  var PIN = '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">'
    + '<path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>';

  // ── Render ────────────────────────────────────────────────────────────────

  function renderSpinner() {
    root.innerHTML = '<div class="state"><div class="spinner"></div>'
      + '<p class="state-sub">Searching for the best stays\u2026</p></div>';
  }

  function renderEmpty() {
    root.innerHTML = '<div class="state">'
      + '<div class="state-icon">&#x1F50D;</div>'
      + '<p class="state-title">No stays found</p>'
      + '<p class="state-sub">Try a different destination.</p></div>';
  }

  function renderHotels(hotels) {
    if (!hotels || hotels.length === 0) { renderEmpty(); return; }

    var location = hotels[0].location || '';
    var count    = hotels.length;

    var cards = hotels.map(function (h) {
      var thumb = (h.image_url && h.image_url.indexOf('example.com') === -1)
        ? '<img src="' + esc(h.image_url) + '" alt="' + esc(h.name) + '" onerror="this.remove()">'
        : '&#x1F3DD;';

      var amenities = getAmenities(h.rating);
      var amenityHtml = amenities.map(function (a) {
        return '<span class="amenity"><span>' + a.icon + '</span>' + esc(a.label) + '</span>';
      }).join('');

      return '<div class="card">'
        + '<div class="card-img">' + thumb + '</div>'
        + '<div class="card-body">'

        // name + score
        + '<div class="name-row">'
        + '<div class="hotel-name">' + esc(h.name) + '</div>'
        + (h.rating ? '<div class="score-pill">' + esc(scoreOut10(h.rating)) + '</div>' : '')
        + '</div>'

        // review descriptor
        + (h.rating ? '<div class="review-line"><span class="descriptor">' + esc(scoreDescriptor(h.rating)) + '</span>'
          + ' &middot; ' + esc(reviewCount(h.price)) + ' reviews</div>' : '')

        // location
        + '<div class="location">' + PIN + esc(h.location) + '</div>'

        // amenities
        + '<div class="amenities">' + amenityHtml + '</div>'

        + '<hr class="divider">'

        // price
        + '<div class="price-section">'
        + '<div class="price-note">Price from</div>'
        + '<div class="price-main">$' + esc(String(h.price)) + '<span class="per"> / night</span></div>'
        + '<div class="price-tax">Includes taxes &amp; fees</div>'
        + '</div>'

        // CTA
        + '<button class="btn-book">View on Booking.com</button>'
        + '<div class="more-link">More about this stay</div>'

        + '</div></div>';
    }).join('');

    root.innerHTML = '<div class="page-header">'
      + '<h2>Stays that match your search</h2>'
      + '<div class="sub">' + esc(location) + ' &middot; ' + count + ' propert' + (count !== 1 ? 'ies' : 'y') + '</div>'
      + '</div>'
      + '<div class="grid">' + cards + '</div>';
  }

  // ── Data sources ──────────────────────────────────────────────────────────

  function tryLoad(data) {
    if (!data) return false;
    var hotels = data.hotels || (Array.isArray(data) ? data : null);
    if (hotels) { renderHotels(hotels); return true; }
    return false;
  }

  function checkOpenAiGlobals() {
    return tryLoad(window.openai && window.openai.toolOutput);
  }

  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d) return;
    if (d.method === 'ui/notifications/tool-result') {
      if (tryLoad(d.params && d.params.structuredContent)) return;
    }
    tryLoad(d.structuredContent || d.data || (d.hotels ? d : null));
  });

  (function () {
    try {
      var raw = new URLSearchParams(location.search).get('data');
      if (raw) tryLoad(JSON.parse(atob(raw)));
    } catch (_) {}
  })();

  // Boot — poll as fallback for race condition
  if (!checkOpenAiGlobals()) {
    window.addEventListener('openai:set-globals', function () { checkOpenAiGlobals(); });
    var attempts = 0;
    var poll = setInterval(function () {
      if (checkOpenAiGlobals() || ++attempts >= 50) clearInterval(poll);
    }, 200);
    renderSpinner();
  }
})();
</script>
</body>
</html>
