<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hotel Results</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f4f8;
      padding: 20px;
      color: #1a202c;
      min-height: 100vh;
    }

    .header { margin-bottom: 20px; }
    .header h2 { font-size: 1.35rem; font-weight: 700; color: #1a202c; }
    .header p  { font-size: 0.85rem; color: #718096; margin-top: 4px; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 18px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    }

    .card-thumb {
      height: 160px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      display: flex; align-items: center; justify-content: center;
      font-size: 3rem; position: relative; overflow: hidden;
    }
    .card-thumb img {
      width: 100%; height: 100%; object-fit: cover;
      position: absolute; inset: 0;
    }

    .card-body { padding: 14px 16px; }

    .card-name {
      font-size: 0.97rem; font-weight: 700; color: #1a202c;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      margin-bottom: 6px;
    }
    .card-location {
      display: flex; align-items: center; gap: 4px;
      font-size: 0.8rem; color: #718096; margin-bottom: 14px;
    }
    .card-footer {
      display: flex; align-items: center; justify-content: space-between;
      padding-top: 10px; border-top: 1px solid #edf2f7;
    }

    .stars { display: flex; align-items: center; gap: 2px; }
    .star { font-size: 0.88rem; }
    .star-on  { color: #f6ad55; }
    .star-off { color: #e2e8f0; }
    .rating-val { margin-left: 5px; font-size: 0.78rem; font-weight: 600; color: #4a5568; }

    .price-amount { font-size: 1.08rem; font-weight: 800; color: #2d3748; }
    .price-unit   { font-size: 0.7rem; color: #a0aec0; margin-left: 2px; }

    .state {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-height: 260px;
      text-align: center; color: #718096; gap: 12px;
    }
    .state-icon  { font-size: 3rem; }
    .state-title { font-size: 1.05rem; font-weight: 600; color: #4a5568; }

    .spinner {
      width: 36px; height: 36px;
      border: 3px solid #e2e8f0; border-top-color: #667eea;
      border-radius: 50%; animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div id="root"></div>

<script>
(function () {
  'use strict';

  var root = document.getElementById('root');

  // ── Render ────────────────────────────────────────────────────────────────

  function escHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function renderSpinner() {
    root.innerHTML = '<div class="state"><div class="spinner"></div>'
      + '<p style="font-size:.85rem">Loading hotels\u2026</p></div>';
  }

  function renderEmpty() {
    root.innerHTML = '<div class="state"><div class="state-icon">&#x1F50D;</div>'
      + '<p class="state-title">No hotels found</p>'
      + '<p style="font-size:.85rem">Try a different location.</p></div>';
  }

  function renderHotels(hotels) {
    if (!hotels || hotels.length === 0) { renderEmpty(); return; }

    var location = hotels[0].location || '';

    var cards = hotels.map(function (h) {
      var rating  = h.rating || 0;
      var rounded = Math.round(rating);
      var stars   = '';
      for (var i = 1; i <= 5; i++) {
        stars += '<span class="star ' + (i <= rounded ? 'star-on' : 'star-off') + '">&#9733;</span>';
      }

      var thumb = (h.image_url && h.image_url.indexOf('example.com') === -1)
        ? '<img src="' + escHtml(h.image_url) + '" alt="' + escHtml(h.name) + '" onerror="this.style.display=\'none\'">'
        : '&#x1F3E8;';

      return '<div class="card">'
        + '<div class="card-thumb">' + thumb + '</div>'
        + '<div class="card-body">'
        + '  <div class="card-name" title="' + escHtml(h.name) + '">' + escHtml(h.name) + '</div>'
        + '  <div class="card-location">'
        + '    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">'
        + '      <path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>'
        + '    </svg>'
        + escHtml(h.location)
        + '  </div>'
        + '  <div class="card-footer">'
        + '    <div class="stars">' + stars + '<span class="rating-val">' + rating + '</span></div>'
        + '    <div>'
        + '      <span class="price-amount">$' + escHtml(String(h.price)) + '</span>'
        + '      <span class="price-unit">/night</span>'
        + '    </div>'
        + '  </div>'
        + '</div></div>';
    }).join('');

    root.innerHTML = '<div class="header">'
      + '<h2>Hotels in ' + escHtml(location) + '</h2>'
      + '<p>' + hotels.length + ' option' + (hotels.length !== 1 ? 's' : '') + ' available</p>'
      + '</div><div class="grid">' + cards + '</div>';
  }

  // ── Data sources (priority order) ─────────────────────────────────────────

  function tryLoad(data) {
    if (!data) return false;
    var hotels = data.hotels || (Array.isArray(data) ? data : null);
    if (hotels) { renderHotels(hotels); return true; }
    return false;
  }

  // 1. window.openai.toolOutput — ChatGPT Apps SDK primary injection
  //    ChatGPT sets this before or after the iframe loads and fires "openai:set-globals"
  function checkOpenAiGlobals() {
    var output = window.openai && window.openai.toolOutput;
    return tryLoad(output);
  }

  // 2. postMessage — JSON-RPC ui/notifications/tool-result
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d) return;

    if (d.method === 'ui/notifications/tool-result') {
      var sc = d.params && d.params.structuredContent;
      if (tryLoad(sc)) return;
    }

    // fallback envelopes
    tryLoad(d.structuredContent || d.data || (d.hotels ? d : null));
  });

  // 3. ?data=<base64-json> — Vercel direct-link testing
  (function () {
    try {
      var raw = new URLSearchParams(location.search).get('data');
      if (raw) tryLoad(JSON.parse(atob(raw)));
    } catch (_) {}
  })();

  // ── Boot ──────────────────────────────────────────────────────────────────

  if (!checkOpenAiGlobals()) {
    // ChatGPT may set window.openai after the iframe loads — listen for the event
    window.addEventListener('openai:set-globals', function () {
      checkOpenAiGlobals();
    });
    renderSpinner();
  }
})();
</script>
</body>
</html>
