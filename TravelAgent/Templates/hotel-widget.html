<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hotel Results</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: transparent;
      color: #1a1a1a;
      font-size: 13px;
      padding: 14px 16px;
    }

    /* ── Header ──────────────────────────────────────────────────── */
    .page-header { margin-bottom: 14px; }
    .page-header h2 {
      font-size: 1rem;
      font-weight: 700;
      color: #111;
      letter-spacing: 0.01em;
    }
    .page-header .sub {
      font-size: 0.74rem;
      color: #888;
      margin-top: 3px;
    }

    /* ── Carousel wrapper ─────────────────────────────────────────── */
    .carousel-outer { position: relative; }

    .carousel {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 6px;
      padding-right: 16px;
      scrollbar-width: none;
    }
    .carousel::-webkit-scrollbar { display: none; }

    /* ── Nav arrows ───────────────────────────────────────────────── */
    .nav-btn {
      position: absolute;
      top: 40%;
      transform: translateY(-50%);
      width: 32px; height: 32px;
      border-radius: 50%;
      border: 1px solid #ddd;
      background: #fff;
      color: #00bfbf;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      z-index: 10;
      box-shadow: 0 2px 8px rgba(0,0,0,0.10);
      transition: background 0.15s, border-color 0.15s;
    }
    .nav-btn:hover { background: #f0fafa; border-color: #00bfbf; }
    .nav-btn.prev { left: -12px; }
    .nav-btn.next { right:  4px; }
    .nav-btn[disabled] { opacity: 0.25; pointer-events: none; }

    /* ── Dots ─────────────────────────────────────────────────────── */
    .dots {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-top: 10px;
      padding-right: 16px;
    }
    .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #ddd;
      cursor: pointer;
      transition: background 0.2s, width 0.2s;
    }
    .dot.active { background: #00bfbf; width: 18px; border-radius: 3px; }

    /* ── Card ────────────────────────────────────────────────────── */
    .card {
      flex-shrink: 0;
      width: 250px;
      display: flex;
      flex-direction: column;
      background: #fff;
      border: 1px solid #e4e4e4;
      border-radius: 12px;
      overflow: hidden;
      scroll-snap-align: start;
      transition: box-shadow 0.2s, transform 0.2s;
    }
    .card:hover { box-shadow: 0 6px 20px rgba(0,0,0,0.10); transform: translateY(-2px); }

    /* ── Image ────────────────────────────────────────────────────── */
    .card-img {
      width: 100%;
      height: 160px;
      background: #e8f0f0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
    }
    .card-img img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* ── Content ──────────────────────────────────────────────────── */
    .card-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 12px 14px 14px;
      gap: 6px;
      min-width: 0;
    }

    /* name + price stacked vertically in vertical card */
    .card-top {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .hotel-info { min-width: 0; }

    .hotel-name {
      font-size: 0.95rem;
      font-weight: 700;
      color: #111;
      line-height: 1.35;
    }
    .hotel-location {
      font-size: 0.73rem;
      color: #777;
      margin-top: 3px;
      display: flex;
      align-items: center;
      gap: 3px;
    }

    /* price block — left aligned in vertical card */
    .price-block {
      text-align: left;
    }
    .price-main {
      font-size: 1.1rem;
      font-weight: 800;
      color: #111;
    }
    .price-meta {
      font-size: 0.67rem;
      color: #888;
      margin-top: 2px;
    }
    .price-tax {
      font-size: 0.67rem;
      color: #22a06b;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 3px;
    }

    /* amenities */
    .amenities {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }
    .amenity-tag {
      font-size: 0.66rem;
      color: #666;
      background: #f4f4f4;
      border: 1px solid #e8e8e8;
      border-radius: 4px;
      padding: 2px 7px;
    }

    /* bottom: rating row + full-width button */
    .card-bottom {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: auto;
      padding-top: 8px;
      border-top: 1px solid #f0f0f0;
    }

    .rating-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* gold stars */
    .stars { color: #f5a623; font-size: 0.85rem; letter-spacing: 1px; }

    /* score badge */
    .score-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 0.74rem;
    }
    .score-num   { font-weight: 800; color: #111; }
    .score-label { color: #444; }
    .score-count { color: #999; }

    /* single action button — teal, full width */
    .btn-details {
      width: 100%;
      background: #00bfbf;
      color: #fff;
      border: none;
      border-radius: 50px;
      padding: 9px 0;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.02em;
      transition: background 0.15s;
    }
    .btn-details:hover { background: #009e9e; }

    /* ── Detail view ────────────────────────────────────────────── */
    .detail-view { display: flex; flex-direction: column; gap: 16px; }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: none;
      border: none;
      color: #00bfbf;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      padding: 0;
      margin-bottom: 2px;
    }
    .back-btn:hover { text-decoration: underline; }

    .detail-gallery {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 100px 100px;
      gap: 4px;
      border-radius: 10px;
      overflow: hidden;
      height: 204px;
    }
    .detail-gallery .gal-main {
      grid-row: 1 / 3;
      position: relative;
      background: #e8f0f0;
    }
    .detail-gallery .gal-thumb {
      position: relative;
      background: #e8f0f0;
    }
    .detail-gallery img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }
    .gal-placeholder { width: 100%; height: 100%; background: #e0ecec; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; }

    .detail-header { display: flex; flex-direction: column; gap: 4px; }
    .detail-name { font-size: 1.05rem; font-weight: 800; color: #111; line-height: 1.3; }
    .detail-addr { font-size: 0.73rem; color: #777; display: flex; align-items: center; gap: 3px; }

    .detail-price-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #f7fefe;
      border: 1px solid #d4f0f0;
      border-radius: 10px;
      padding: 10px 14px;
    }
    .detail-price-label { font-size: 0.68rem; color: #888; margin-bottom: 2px; }
    .detail-price-main { font-size: 1.1rem; font-weight: 800; color: #111; }
    .detail-price-tax { font-size: 0.67rem; color: #22a06b; margin-top: 2px; }
    .btn-select {
      background: #00bfbf;
      color: #fff;
      border: none;
      border-radius: 50px;
      padding: 9px 18px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-select:hover { background: #009e9e; }

    .detail-desc { font-size: 0.78rem; color: #444; line-height: 1.6; }

    .section-title { font-size: 0.88rem; font-weight: 700; color: #111; margin-bottom: 8px; }

    .amenity-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 16px;
    }
    .amenity-item {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.74rem;
      color: #333;
    }
    .amenity-icon { font-size: 1rem; flex-shrink: 0; }

    /* Room list */
    .room-group {
      border: 1px solid #e4e4e4;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 10px;
    }
    .room-group-header {
      display: flex;
      gap: 10px;
      padding: 10px 12px;
      background: #fafafa;
      border-bottom: 1px solid #eee;
    }
    .room-thumb {
      width: 64px; height: 52px;
      border-radius: 6px;
      object-fit: cover;
      flex-shrink: 0;
      background: #e8f0f0;
    }
    .room-thumb-placeholder { width: 64px; height: 52px; border-radius: 6px; background: #e0ecec; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; flex-shrink: 0; }
    .room-group-info { flex: 1; min-width: 0; }
    .room-group-name { font-size: 0.82rem; font-weight: 700; color: #111; text-transform: uppercase; letter-spacing: 0.02em; }
    .room-group-bed { font-size: 0.7rem; color: #666; margin-top: 3px; }

    .rate-option {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border-top: 1px solid #f0f0f0;
      gap: 8px;
    }
    .rate-option:first-of-type { border-top: none; }
    .rate-info { flex: 1; min-width: 0; }
    .rate-cancel { font-size: 0.7rem; font-weight: 600; color: #22a06b; margin-bottom: 3px; }
    .rate-cancel.non-refundable { color: #d64545; }
    .rate-meals { font-size: 0.7rem; color: #555; }
    .rate-price-col { text-align: right; flex-shrink: 0; }
    .rate-strike { font-size: 0.68rem; color: #aaa; text-decoration: line-through; }
    .rate-price { font-size: 0.95rem; font-weight: 800; color: #111; }
    .rate-nights { font-size: 0.65rem; color: #888; }
    .btn-book-sm {
      background: #00bfbf;
      color: #fff;
      border: none;
      border-radius: 50px;
      padding: 7px 14px;
      font-size: 0.74rem;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
    }
    .btn-book-sm:hover { background: #009e9e; }

    /* ── States ──────────────────────────────────────────────────── */
    .state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 200px;
      text-align: center;
      gap: 12px;
    }
    .state-title { font-size: 0.95rem; font-weight: 600; color: #00bfbf; }
    .state-sub   { font-size: 0.8rem; color: #999; }
    .spinner {
      width: 30px; height: 30px;
      border: 2px solid #e0e0e0;
      border-top-color: #00bfbf;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div id="root"></div>

<script>
(function () {
  'use strict';

  var root = document.getElementById('root');

  /* ── Helpers ───────────────────────────────────────────────────── */

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  var PIN = '<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="flex-shrink:0;opacity:0.6">'
    + '<path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>';

  var CHECK = '<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" style="flex-shrink:0">'
    + '<polyline points="20 6 9 17 4 12"/></svg>';

  function starHtml(n) {
    var full  = Math.floor(n || 0);
    var half  = (n - full) >= 0.5 ? 1 : 0;
    var empty = 5 - full - half;
    return '<span class="stars">'
      + '★'.repeat(full)
      + (half ? '½' : '')
      + '<span style="opacity:0.3">' + '★'.repeat(empty) + '</span>'
      + '</span>';
  }

  // guest_rating is 0–100 scale from the API
  function scoreNum(r) { return Math.round(parseFloat(r) || 0); }

  function scoreLabel(r) {
    var n = parseFloat(r) || 0;
    if (n >= 95) return 'Exceptional';
    if (n >= 90) return 'Wonderful';
    if (n >= 80) return 'Excellent';
    if (n >= 70) return 'Very Good';
    if (n >= 60) return 'Good';
    return 'Pleasant';
  }

  function fmtPrice(val, cur) {
    if (!val) return null;
    var sym = cur === 'AUD' ? 'AU $' : cur === 'USD' ? '$' : cur === 'EUR' ? '€' : (cur || '') + ' ';
    return sym + parseFloat(val).toFixed(0);
  }

  function resolveAmenities(h) {
    if (h.amenities && h.amenities.length) return h.amenities.slice(0, 5);
    var n = parseFloat(h.guest_rating) || 0; // 0–100 scale
    if (n >= 90) return ['Pool', 'Spa', 'Restaurant', 'Room service', 'Airport transfer'];
    if (n >= 70) return ['Pool', 'Restaurant', 'Parking', '24-hr front desk', 'Breakfast'];
    return ['Parking', 'Restaurant', 'Pet friendly', 'Garden', 'Wi-Fi'];
  }

  function resolveImage(h) {
    var url = h.image_url
      || (h.images && h.images.length ? h.images[0] : null);
    return url || null;
  }

  /* ── Render ────────────────────────────────────────────────────── */

  function renderSpinner() {
    root.innerHTML = '<div class="state"><div class="spinner"></div>'
      + '<p class="state-sub">Searching for the best stays\u2026</p></div>';
  }

  function renderEmpty() {
    root.innerHTML = '<div class="state">'
      + '<p class="state-title">No stays found</p>'
      + '<p class="state-sub">Try a different destination or dates.</p></div>';
  }

  function renderHotels(hotels) {
    if (!hotels || hotels.length === 0) { renderEmpty(); return; }
    _lastHotels = hotels;
    console.log('[hotel-widget] first hotel:', JSON.stringify(hotels[0], null, 2));

    var location = hotels[0].location || '';
    var count    = hotels.length;

    var cards = hotels.map(function (h, idx) {
      var imgUrl = resolveImage(h);
      var imgHtml = imgUrl
        ? '<img src="' + esc(imgUrl) + '" alt="' + esc(h.name) + '" onerror="console.warn(\'img failed:\',this.src);this.style.display=\'none\'">'
        : '&#x1F3DD;';

      var cur = (h.currency || 'AUD').toUpperCase();
      var priceMain = fmtPrice(h.price, cur);

      var priceHtml = '';
      if (priceMain) priceHtml += '<div class="price-main">' + esc(priceMain) + '</div>';
      priceHtml += '<div class="price-meta">1 room, 1 night</div>';
      priceHtml += '<div class="price-tax">' + CHECK + '&nbsp;Taxes and fees included</div>';

      var amenities = resolveAmenities(h);
      var amenityHtml = amenities.map(function (a) {
        return '<span class="amenity-tag">' + esc(a) + '</span>';
      }).join('');

      var ratingHtml = '';
      if (h.star_rating) ratingHtml += starHtml(h.star_rating);

      var scoreHtml = '';
      if (h.guest_rating) {
        scoreHtml = '<div class="score-badge">'
          + '<span class="score-num">' + scoreNum(h.guest_rating) + '</span>'
          + '<span class="score-label">' + esc(scoreLabel(h.guest_rating)) + '</span>'
          + (h.guest_rating_count ? '<span class="score-count">(' + esc(String(h.guest_rating_count)) + ')</span>' : '')
          + '</div>';
      }

      return '<div class="card">'
        + '<div class="card-img">' + imgHtml + '</div>'
        + '<div class="card-content">'

        // name + location + price stacked vertically
        + '<div class="card-top">'
          + '<div class="hotel-info">'
            + '<div class="hotel-name">' + esc(h.name) + '</div>'
            + '<div class="hotel-location">' + PIN + '&nbsp;' + esc(h.location) + '</div>'
          + '</div>'
          + '<div class="price-block">' + priceHtml + '</div>'
        + '</div>'

        // amenities
        + '<div class="amenities">' + amenityHtml + '</div>'

        // bottom: stars + score + button
        + '<div class="card-bottom">'
          + '<div class="rating-row">' + ratingHtml + scoreHtml + '</div>'
          + '<button class="btn-details" data-idx="' + idx + '">View Details</button>'
        + '</div>'

        + '</div></div>';
    }).join('');

    var dotHtml = hotels.map(function (_, i) {
      return '<div class="dot' + (i === 0 ? ' active' : '') + '" data-index="' + i + '"></div>';
    }).join('');

    root.innerHTML = '<div class="page-header">'
      + '<h2>Stays that match your search</h2>'
      + '<div class="sub">' + esc(location) + ' &middot; ' + count + ' propert' + (count !== 1 ? 'ies' : 'y') + '</div>'
      + '</div>'
      + '<div class="carousel-outer">'
      + '<button class="nav-btn prev" id="prev">&#8592;</button>'
      + '<div class="carousel" id="carousel">' + cards + '</div>'
      + '<button class="nav-btn next" id="next">&#8594;</button>'
      + '</div>'
      + '<div class="dots" id="dots">' + dotHtml + '</div>';

    initCarousel();

    // Wire up "View Details" buttons via event delegation
    document.getElementById('carousel').addEventListener('click', function(e) {
      var btn = e.target.closest('.btn-details');
      if (!btn) return;
      var idx = parseInt(btn.getAttribute('data-idx'), 10);
      var hotel = hotels[idx];
      if (!hotel) return;
      var ctx = _context || { check_in: '', check_out: '', adults: 2, rooms: 1, currency: 'AUD' };
      if (_apiUrl) {
        fetchAndShowDetail(hotel, ctx, _apiUrl);
      } else {
        // No API URL — prompt user to ask the AI for details
        root.innerHTML = '<div class="state">'
          + '<p class="state-title">Ask for details</p>'
          + '<p class="state-sub">Ask the assistant: "Show me details for ' + esc(hotel.name || 'this hotel') + '"</p>'
          + '<button class="btn-book" style="margin-top:12px;width:auto;padding:9px 20px" id="backToList">Back to results</button>'
          + '</div>';
        document.getElementById('backToList').addEventListener('click', function() { renderHotels(hotels); });
      }
    });
  }

  function initCarousel() {
    var carousel = document.getElementById('carousel');
    var prev     = document.getElementById('prev');
    var next     = document.getElementById('next');
    var dotsEl   = document.getElementById('dots');
    if (!carousel) return;

    var cards   = carousel.querySelectorAll('.card');
    var total   = cards.length;
    var current = 0;

    function cardWidth() { return cards[0] ? cards[0].offsetWidth + 14 : 264; }

    function updateUI() {
      prev.disabled = current === 0;
      next.disabled = current >= total - 1;
      if (!dotsEl) return;
      dotsEl.querySelectorAll('.dot').forEach(function (d, i) {
        d.classList.toggle('active', i === current);
      });
    }

    function goTo(index) {
      current = Math.max(0, Math.min(index, total - 1));
      carousel.scrollTo({ left: current * cardWidth(), behavior: 'smooth' });
      updateUI();
    }

    prev.addEventListener('click', function () { goTo(current - 1); });
    next.addEventListener('click', function () { goTo(current + 1); });

    if (dotsEl) {
      dotsEl.addEventListener('click', function (e) {
        var dot = e.target.closest('.dot');
        if (dot) goTo(parseInt(dot.dataset.index, 10));
      });
    }

    var t;
    carousel.addEventListener('scroll', function () {
      clearTimeout(t);
      t = setTimeout(function () {
        current = Math.max(0, Math.min(Math.round(carousel.scrollLeft / cardWidth()), total - 1));
        updateUI();
      }, 80);
    });

    updateUI();
  }

  /* ── Global state ──────────────────────────────────────────────── */
  var _context = null;   // { check_in, check_out, adults, rooms, currency }
  var _apiUrl  = null;   // backend base URL
  var _lastHotels = null;

  /* ── Amenity icon map ──────────────────────────────────────────── */
  var AMENITY_ICONS = {
    'wifi': '📶', 'wi-fi': '📶', 'internet': '📶',
    'pool': '🏊', 'swimming': '🏊',
    'spa': '💆', 'gym': '🏋️', 'fitness': '🏋️',
    'restaurant': '🍽️', 'dining': '🍽️',
    'bar': '🍸', 'breakfast': '☕',
    'parking': '🅿️', 'airport': '✈️',
    'room service': '🛎️', 'concierge': '🛎️',
    'pet': '🐾', 'garden': '🌿', 'beach': '🏖️'
  };

  function amenityIcon(name) {
    var lower = (name || '').toLowerCase();
    for (var key in AMENITY_ICONS) {
      if (lower.indexOf(key) !== -1) return AMENITY_ICONS[key];
    }
    return '✓';
  }

  /* ── Detail view ──────────────────────────────────────────────── */

  function renderDetailLoading() {
    root.innerHTML = '<div class="state"><div class="spinner"></div>'
      + '<p class="state-sub">Loading hotel details\u2026</p></div>';
  }

  function renderDetail(d) {
    var imgs = d.images || [];
    var galleryHtml = '<div class="detail-gallery">';
    galleryHtml += '<div class="gal-main">'
      + (imgs[0] ? '<img src="' + esc(imgs[0]) + '" alt="" onerror="this.style.display=\'none\'">'
                 : '<div class="gal-placeholder">🏨</div>')
      + '</div>';
    galleryHtml += '<div class="gal-thumb">'
      + (imgs[1] ? '<img src="' + esc(imgs[1]) + '" alt="" onerror="this.style.display=\'none\'">'
                 : '<div class="gal-placeholder">🌅</div>')
      + '</div>';
    galleryHtml += '<div class="gal-thumb">'
      + (imgs[2] ? '<img src="' + esc(imgs[2]) + '" alt="" onerror="this.style.display=\'none\'">'
                 : '<div class="gal-placeholder">🛏️</div>')
      + '</div>';
    galleryHtml += '</div>';

    var cur = (d.currency || 'AUD').toUpperCase();
    var priceStr = d.price ? fmtPrice(d.price, cur) : null;

    var priceBar = priceStr
      ? '<div class="detail-price-bar">'
        + '<div><div class="detail-price-label">From per night</div>'
        + '<div class="detail-price-main">' + esc(priceStr) + '</div>'
        + '<div class="detail-price-tax">✓&nbsp;Taxes and fees included</div></div>'
        + '<button class="btn-select" onclick="document.getElementById(\'rooms-section\').scrollIntoView({behavior:\'smooth\'})">Select Room</button>'
        + '</div>'
      : '';

    var amenitiesHtml = '';
    if (d.amenities && d.amenities.length) {
      amenitiesHtml = '<div>'
        + '<div class="section-title">Popular Amenities</div>'
        + '<div class="amenity-grid">'
        + d.amenities.slice(0, 8).map(function(a) {
            return '<div class="amenity-item"><span class="amenity-icon">' + amenityIcon(a) + '</span><span>' + esc(a) + '</span></div>';
          }).join('')
        + '</div></div>';
    }

    // Room rates grouped by room type
    var roomGroups = {};
    (d.room_rates || []).forEach(function(r) {
      var key = r.room_name || r.room_type || 'Standard Room';
      if (!roomGroups[key]) roomGroups[key] = { info: r, rates: [] };
      roomGroups[key].rates.push(r);
    });

    var roomsHtml = '';
    Object.keys(roomGroups).forEach(function(key) {
      var g = roomGroups[key];
      var r0 = g.info;
      var thumbHtml = r0.image_url
        ? '<img class="room-thumb" src="' + esc(r0.image_url) + '" alt="" onerror="this.style.display=\'none\'">'
        : '<div class="room-thumb-placeholder">🛏️</div>';

      roomsHtml += '<div class="room-group">';
      roomsHtml += '<div class="room-group-header">'
        + thumbHtml
        + '<div class="room-group-info">'
        + '<div class="room-group-name">' + esc(key) + '</div>'
        + (r0.bed_configuration ? '<div class="room-group-bed">🛏 ' + esc(r0.bed_configuration) + '</div>' : '')
        + '</div></div>';

      g.rates.forEach(function(rate) {
        var rateCur = (rate.currency || cur).toUpperCase();
        var cancelClass = rate.refundable ? 'rate-cancel' : 'rate-cancel non-refundable';
        var cancelText = rate.refundable
          ? (rate.free_cancellation_until
              ? 'Free cancellation before ' + new Date(rate.free_cancellation_until).toLocaleDateString('en-AU', { day:'2-digit', month:'short', year:'numeric' })
              : 'Free cancellation')
          : 'Non-refundable';

        var strikePriceHtml = rate.strike_through_price
          ? '<div class="rate-strike">' + esc(fmtPrice(rate.strike_through_price, rateCur)) + '</div>' : '';
        var priceHtml2 = '<div class="rate-price">' + esc(fmtPrice(rate.price, rateCur)) + '</div>'
          + '<div class="rate-nights">total for 1 night</div>';

        roomsHtml += '<div class="rate-option">'
          + '<div class="rate-info">'
          + '<div class="' + cancelClass + '">' + esc(cancelText) + '</div>'
          + '<div class="rate-meals">☑ ' + esc(rate.meals_description || 'Meals not included') + '</div>'
          + '</div>'
          + '<div class="rate-price-col">' + strikePriceHtml + priceHtml2 + '</div>'
          + '<button class="btn-book-sm">Book Now</button>'
          + '</div>';
      });

      roomsHtml += '</div>';
    });

    var html = '<div class="detail-view">'
      + '<button class="back-btn" id="backBtn">&#8592; Back to results</button>'
      + galleryHtml
      + '<div class="detail-header">'
      + '<div class="detail-name">' + esc(d.name || 'Hotel') + '</div>'
      + (starHtml(d.star_rating || 0))
      + (d.address ? '<div class="detail-addr">' + PIN + '&nbsp;' + esc(d.address) + '</div>' : '')
      + '</div>'
      + priceBar
      + (d.description ? '<div class="detail-desc">' + esc(d.description) + '</div>' : '')
      + amenitiesHtml
      + (roomsHtml ? '<div id="rooms-section"><div class="section-title">Choose your room</div>' + roomsHtml + '</div>' : '')
      + '</div>';

    root.innerHTML = html;

    document.getElementById('backBtn').addEventListener('click', function() {
      if (_lastHotels) renderHotels(_lastHotels);
    });
  }

  function fetchAndShowDetail(hotel, ctx, apiUrl) {
    renderDetailLoading();
    var params = new URLSearchParams({
      hotel_id:   hotel.id   || '',
      hotel_code: hotel.hotel_code || '',
      provider:   hotel.provider   || '',
      check_in:   ctx.check_in,
      check_out:  ctx.check_out,
      adults:     String(ctx.adults  || 2),
      rooms:      String(ctx.rooms   || 1),
      currency:   ctx.currency || 'AUD'
    });
    fetch(apiUrl + '/mcp/hotel/details?' + params.toString())
      .then(function(res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then(function(detail) { renderDetail(detail); })
      .catch(function(err) {
        console.warn('[hotel-widget] detail fetch failed:', err);
        root.innerHTML = '<div class="state"><p class="state-title">Could not load details</p>'
          + '<p class="state-sub">Please try again.</p></div>';
        setTimeout(function() { if (_lastHotels) renderHotels(_lastHotels); }, 2000);
      });
  }

  /* ── Data sources ──────────────────────────────────────────────── */

  function tryLoad(data) {
    if (!data) return false;
    // Detail view
    if (data.hotel_detail) { renderDetail(data.hotel_detail); return true; }
    // Hotel list
    var hotels = data.hotels || (Array.isArray(data) ? data : null);
    if (hotels) {
      if (data.context) _context = data.context;
      if (data.api_url) _apiUrl  = data.api_url;
      renderHotels(hotels);
      return true;
    }
    return false;
  }

  function checkOpenAiGlobals() {
    return tryLoad(window.openai && window.openai.toolOutput);
  }

  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d) return;
    if (d.method === 'ui/notifications/tool-result') {
      if (tryLoad(d.params && d.params.structuredContent)) return;
    }
    tryLoad(d.structuredContent || d.data || (d.hotels ? d : null));
  });

  (function () {
    try {
      var raw = new URLSearchParams(location.search).get('data');
      if (raw) tryLoad(JSON.parse(atob(raw)));
    } catch (_) {}
  })();

  if (!checkOpenAiGlobals()) {
    window.addEventListener('openai:set-globals', function () { checkOpenAiGlobals(); });
    var attempts = 0;
    var poll = setInterval(function () {
      if (checkOpenAiGlobals() || ++attempts >= 50) clearInterval(poll);
    }, 200);
    renderSpinner();
  }
})();
</script>
</body>
</html>
